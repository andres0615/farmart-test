# ------------------------------------------------------------
# Override de desarrollo: frontend con Vite (HMR) en el puerto 5173.
# Uso: docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
# ------------------------------------------------------------
services:
  frontend:
    build:
      context: ./frontend
      target: dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules

  api:
    build:
      context: ./backend
      target: dev
    volumes:
      - ./backend:/var/www/html
      - /var/www/html/vendor
      - backend-storage:/var/www/html/storage
      - backend-cache:/var/www/html/bootstrap/cache
    environment:
      APP_ENV: local
      APP_DEBUG: "true"

volumes:
  backend-storage:
  backend-cache: